services:
  hangar5:
    image: ghcr.io/pabloceballosyanez/hangar5:latest
    container_name: hangar5
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/hangar5.db
      - NEXT_PUBLIC_URL=http://192.168.50.38:3000
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN:-}
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
