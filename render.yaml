services:
  - type: web
    name: hangar5
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/hangar5.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
