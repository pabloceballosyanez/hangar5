<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img" aria-label="Hangar Cinco">
  <!--
    El logo era un PNG de 512x512 donde el dibujo ocupaba solo el 60% del
    ancho. Al ponerlo a 2.15in en la carta se estiraba y salía pixelado.

    Aquí se reconstruye como SVG: la silueta del hangar (base plana, lados
    rectos, techo inclinado) y el texto en tipografía real. Escala a
    cualquier tamaño sin perder un borde, y pesa menos de 2 KB.

    Las letras usan Archivo, que ya carga la carta. Si no estuviera
    disponible, cae a cualquier sans geométrica.
  -->
  <defs>
    <style>
      .t { font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; fill: currentColor; }
      .hangar { font-size: 84px; font-weight: 800; letter-spacing: -0.005em; }
      .cinco  { font-size: 25px; font-weight: 500; letter-spacing: 0.42em; }
    </style>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round">
    <!-- Silueta del hangar con techo inclinado -->
    <path d="M 26 196 L 26 66 L 240 18 L 454 66 L 454 196 Z"/>
  </g>

  <text class="t hangar" x="240" y="128" text-anchor="middle">HANGAR</text>
  <text class="t cinco"  x="240" y="163" text-anchor="middle">CINCO</text>
</svg>
